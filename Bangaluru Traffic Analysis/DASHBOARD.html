<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urban Traffic Flow & Congestion Analytics</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#1f2937}
.header{padding:28px 6%;background:#111827;color:white}
.container{padding:28px 6%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{background:white;border-radius:12px;padding:18px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
.value{font-size:28px;font-weight:700;margin-top:8px}
.chart{background:white;border-radius:12px;padding:12px;margin-top:20px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="header">
<h1>Urban Traffic Flow & Congestion Analytics</h1>
<p>Bengaluru traffic analysis | Python, Pandas, NumPy, Matplotlib, Seaborn & Plotly</p>
</div>
<div class="container">
<div class="grid">
<div class="card"><div>Total Records</div><div class="value">8,936</div></div>
<div class="card"><div>Areas Covered</div><div class="value">8</div></div>
<div class="card"><div>Avg Traffic Volume</div><div class="value">29,236</div></div>
<div class="card"><div>Avg Congestion</div><div class="value">80.82</div></div>
</div>
<div class="chart"><div id="day"></div></div>
<div class="chart"><div id="road"></div></div>
<div class="chart"><div id="delay"></div></div>
<div class="chart"><div id="eff"></div></div>
</div>
<script>
const days = ["Friday","Monday","Saturday","Sunday","Thursday","Tuesday","Wednesday"];
const dayVol = [28842.780527,29510.237654,29062.983721,29105.277516,29530.357600,28911.255157,29697.560821];
Plotly.newPlot("day",[{
x:days,y:dayVol,type:"bar"
}],{title:"Average Traffic Volume by Day",margin:{t:60,l:60,r:20,b:80},xaxis:{title:"Day"},yaxis:{title:"Average Traffic Volume"}});

const roads = ["100 Feet Road","Anil Kumble Circle","Ballari Road","CMH Road","Hebbal Flyover","Hosur Road","ITPL Main Road","Jayanagar 4th Block","Marathahalli Bridge","Sarjapur Road","Silk Board Junction","Sony World Junction","South End Circle","Trinity Circle","Tumkur Road","Yeshwanthpur Circle"];
const roadVol = [31956.852326,35251.828722,26272.640756,32611.924419,26794.924051,16557.223827,21866.037778,24496.236207,20772.953252,40189.95,16134.534545,41470.80117,24704.11973,35350.137466,18574.490305,19277.115282];
Plotly.newPlot("road",[{
x:roadVol,y:roads,type:"bar",orientation:"h"
}],{title:"Average Traffic Volume by Road / Intersection",margin:{t:60,l:170,r:20,b:60},xaxis:{title:"Average Traffic Volume"},yaxis:{title:"Road / Intersection"}});

const areas = ["Koramangala","M.G. Road","Indiranagar","Hebbal","Jayanagar","Whitefield","Yeshwanthpur","Electronic City"];
const delay = [1242.904404,1033.271428,937.532591,745.202168,690.219063,562.624437,482.2658,409.139721];
Plotly.newPlot("delay",[{
x:areas,y:delay,type:"bar"
}],{title:"Average Delay Index by Area",margin:{t:60,l:60,r:20,b:100},xaxis:{title:"Area"},yaxis:{title:"Delay Index"}});

const eff = [0.001081,0.001295,0.001482,0.001898,0.001981,0.002441,0.002810,0.003297];
Plotly.newPlot("eff",[{
x:areas,y:eff,type:"bar"
}],{title:"Average Network Efficiency by Area",margin:{t:60,l:60,r:20,b:100},xaxis:{title:"Area"},yaxis:{title:"Efficiency"}});
</script>
</body>
</html>
